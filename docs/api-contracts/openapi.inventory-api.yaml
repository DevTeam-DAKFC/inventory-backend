            $ref: '#/components/schemas/MovementType'
          description: Filter by movement type.
        - in: query
          name: userId
          required: false
          schema:
            type: string
          description: Filter by user that registered the movement.
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound for `createdAt`.
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive upper bound for `createdAt`.
        - in: query
          name: page
          required: false
          schema:
            type: integer
