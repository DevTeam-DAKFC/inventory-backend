                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ImportBatch'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to list import batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - ImportBatches
      summary: Create an import batch
      description: |
        Creates a validation batch from parsed product import metadata.
        Import is a complementary path for bulk-loading products; the
        primary, always-available product creation path is the manual flow
        through `POST /products`.

        The actual CSV body is expected to be uploaded through a separate
        multipart endpoint or signed-URL flow, which is out of scope for
        this version of the contract. This payload carries the batch
        metadata only; validation of the parsed rows is performed
        server-side and surfaced through subsequent reads of the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBatchCreateRequest'
            example:
              fileName: inventory_initial.csv
      responses:
        '201':
          description: Batch created. Rows are queued for validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
              example:
                id: import_001
                fileName: inventory_initial.csv
                importedBy: user_admin_001
                status: pending
                totalRows: 0
                validRows: 0
                invalidRows: 0
                createdAt: '2026-06-02T20:00:00Z'
                completedAt: null
        '400':
          description: Validation error on the request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to create import batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

