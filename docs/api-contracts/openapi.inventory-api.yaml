            default: 1
          description: Page number, starting at 1.
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page.
      responses:
        '200':
          description: Paginated list of inventory movements.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/InventoryMovement'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to list movements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - InventoryMovements
      summary: Register an inventory movement
      description: |
        Write path for stock changes. The backend performs the following
        steps atomically:

        1. Loads the product and validates that it exists and is active.
        2. Loads the branch and validates that it exists and is active.
        3. Loads the matching stock record by `productId` + `branchId`.
        4. For `outgoing` movements, validates that `quantity` does not
           exceed the current `availableQuantity`.
        5. Computes the new balance.
        6. Updates the Stock record and creates the InventoryMovement
           record in a single transaction, so callers never observe a
           partial state.

        Domain rule failures are reported with HTTP 422 and the standard
        `ErrorResponse` shape using one of the codes `insufficient_stock`,
        `inactive_product` or `inactive_branch`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryMovementCreateRequest'
            example:
              productId: product_rice_001
              branchId: branch_central
              type: incoming
              quantity: 40
              reason: Initial import
              notes: Carga inicial de inventario.
      responses:
        '201':
          description: Movement registered and stock updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMovement'
              example:
                id: movement_001
                productId: product_rice_001
                branchId: branch_central
                userId: user_admin_001
                type: incoming
                quantity: 40
                previousStock: 0
                resultingStock: 40
                reason: Initial import
                notes: Carga inicial de inventario.
                createdAt: '2026-06-02T20:15:00Z'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to register this movement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product, branch or stock record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Domain rule failure. Possible `error.code` values:
            `insufficient_stock`, `inactive_product`, `inactive_branch`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: insufficient_stock
                  message: The requested quantity exceeds the available stock.
                  details:
                    - field: quantity
                      message: Requested 10 but only 4 available at the selected branch.
                  requestId: req_movement_insufficient_01
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

