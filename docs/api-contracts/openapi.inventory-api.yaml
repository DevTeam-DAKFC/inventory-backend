  /inventory-movements:
    get:
      tags:
        - InventoryMovements
      summary: List inventory movements
      description: |
        Read-only listing of inventory movements, optionally filtered by
        branch, product, type, user or date range.
      parameters:
        - in: query
          name: branchId
          required: false
