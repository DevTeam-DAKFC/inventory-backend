openapi: 3.0.3

info:
  title: Inventory Mobile API
  description: |
    Este archivo OpenAPI define el contrato REST esperado para la aplicacion
    movil de inventario.

    Direccion planificada:
    - La implementacion prevista del backend es ASP.NET Core Web API.
    - Flutter consumira esta API usando Dio / HttpClient.
    - SQL Server sera la capa de persistencia planificada detras del backend.
    - Docker y Docker Compose se usaran para la infraestructura del backend.

    Estado:
    - Este contrato no implica que el backend, SQL Server o Docker Compose ya
      esten implementados o configurados.
    - Los endpoints, esquemas y ejemplos describen la forma esperada de la
      integracion cuando el backend este disponible.

    Relacion con Firebase:
    - Firebase no es la capa principal de persistencia del sistema.
    - Firebase sigue siendo relevante para Firebase Cloud Messaging (FCM).
    - Firebase Storage puede usarse opcionalmente para imagenes de productos si
      el equipo decide adoptarlo.
  version: 1.0.0

servers:
  - url: https://api.inventory.example.com
    description: Production-like environment placeholder.
  - url: http://localhost:8080
    description: Local development environment.

tags:
  - name: Auth
    description: Authentication and current-user retrieval. MVP-critical.
  - name: Users
    description: User profile, role and branch assignment management.
  - name: Branches
    description: Store branches that hold inventory.
  - name: Products
    description: Product catalog. Stock is not embedded in product records.
  - name: Stock
    description: Read-only balances of available quantity by product and branch.
  - name: InventoryMovements
    description: Write path for incoming and outgoing inventory movements.
  - name: ProductLookup
    description: External-product suggestion lookup, decoupled from the upstream provider.
  - name: NotificationTokens
    description: Device push notification token registration.
  - name: ImportBatches
    description: Optional CSV import lifecycle for bulk product loading.

security:
  - bearerAuth: []

paths:

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: |
        MVP-critical. Creates a new user account from a public registration
        request. The response includes an access token so that the client
        does not need to call `/auth/login` immediately after registering.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '201':
          description: User registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: conflict
                  message: Email already registered.
                  details:
                    - field: email
                      message: An account with this email already exists.
                  requestId: req_register_01
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in with email and password
      description: |
        MVP-critical. Exchanges credentials for an access token and returns
        the authenticated user profile.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unauthorized
                  message: Invalid email or password.
                  requestId: req_login_01
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current authenticated user
      description: |
        MVP-critical. Returns the profile of the authenticated user, derived
        from the bearer token. The application uses this endpoint to
        rehydrate the session after launch.
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Invalidate the current session
      description: |
        Invalidates the access token associated with the current session.
        Whether the token is revoked server-side or only discarded by the
        client depends on the backend implementation.
      responses:
        '204':
          description: Session invalidated.
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    get:
      tags:
        - Users
      summary: List users
      description: |
        Admin-oriented listing of users with optional filters. Non-admin
        callers should use `GET /auth/me` to read their own profile.
      parameters:
        - in: query
          name: role
          required: false
          schema:
            $ref: '#/components/schemas/UserRole'
          description: Filter by user role.
        - in: query
          name: branchId
          required: false
          schema:
            type: string
          description: Filter by branch assignment.
        - in: query
          name: isActive
          required: false
          schema:
            type: boolean
          description: Filter by active status.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, starting at 1.
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page.
      responses:
        '200':
          description: Paginated list of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to list users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Users
      summary: Create a user (admin-side)
      description: |
        Admin-driven user creation. Allows assigning `role` and `branchIds`
        without exchanging a password. For public credentialed registration
        use `POST /auth/register`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to create users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
        description: Identifier of the user.
    get:
      tags:
        - Users
      summary: Get user by id
      responses:
        '200':
          description: User detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to read this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Users
      summary: Update user
      description: |
        Updates editable fields on a user profile. Only the fields included
        in the request body are modified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to update this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict updating user, such as a duplicate email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}/deactivate:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
        description: Identifier of the user.
    patch:
      tags:
        - Users
      summary: Deactivate user
      description: |
        Soft-deactivates a user. The user record is preserved for traceability
        of historical movements.
      responses:
        '204':
          description: User deactivated.
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to deactivate this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches:
    get:
      tags:
        - Branches
      summary: List branches
      parameters:
        - in: query
          name: isActive
          required: false
          schema:
            type: boolean
          description: Filter by active status.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, starting at 1.
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page.
      responses:
        '200':
          description: Paginated list of branches.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Branch'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to list branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Branches
      summary: Create branch
      description: Admin-driven branch creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreateRequest'
      responses:
        '201':
          description: Branch created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to create branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Branch name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/{branchId}:
    parameters:
      - in: path
        name: branchId
        required: true
        schema:
          type: string
        description: Identifier of the branch.
    get:
      tags:
        - Branches
      summary: Get branch by id
      responses:
        '200':
          description: Branch detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to read this branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Branch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Branches
      summary: Update branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchUpdateRequest'
      responses:
        '200':
          description: Branch updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to update this branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Branch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict updating branch, such as a duplicate name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/{branchId}/deactivate:
    parameters:
      - in: path
        name: branchId
        required: true
        schema:
          type: string
        description: Identifier of the branch.
    patch:
      tags:
        - Branches
      summary: Deactivate branch
      description: |
        Soft-deactivates a branch. Existing stock and historical movements
        are preserved for traceability. An inactive branch should not be
        used to register new movements.
      responses:
        '204':
          description: Branch deactivated.
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to deactivate this branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Branch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products:
    get:
      tags:
        - Products
      summary: List products
      description: |
        Catalog listing of products with optional filters. Stock is not
        embedded in the product record; use the Stock endpoints to read
        availability by branch.
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Free-text search across name, sku and barcode.
        - in: query
          name: category
          required: false
          schema:
            type: string
          description: Filter by product category.
        - in: query
          name: isActive
          required: false
          schema:
            type: boolean
          description: Filter by active status.
        - in: query
          name: lowStockOnly
          required: false
          schema:
            type: boolean
            default: false
          description: |
            If true, only include products that have at least one branch
            where `availableQuantity` is at or below `minStock`.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, starting at 1.
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page.
      responses:
        '200':
          description: Paginated list of products.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to list products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Products
      summary: Create product
      description: |
        Creates a product in the catalog. Covers manual registration as
        well as confirmed values from the external product lookup. Stock
        is not set through this endpoint; register an `incoming` inventory
        movement to set the initial balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to create products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate sku or barcode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: conflict
                  message: A product with this sku already exists.
                  details:
                    - field: sku
                      message: sku must be unique within the catalog.
                  requestId: req_product_create_01
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{productId}:
    parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
        description: Identifier of the product.
    get:
      tags:
        - Products
      summary: Get product by id
      responses:
        '200':
          description: Product detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to read this product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Products
      summary: Update product
      description: |
        Updates editable fields on a product. Only the fields included in
        the request body are modified. Stock balances cannot be modified
        through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to update this product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate sku or barcode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{productId}/deactivate:
    parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
        description: Identifier of the product.
    patch:
      tags:
        - Products
      summary: Deactivate product
      description: |
        Soft-deactivates a product. Existing stock and historical movements
        remain visible, but an inactive product must not be used to
        register new movements.
      responses:
        '204':
          description: Product deactivated.
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to deactivate this product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
