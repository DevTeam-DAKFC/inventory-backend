                status: failed
                totalRows: 4
                validRows: 0
                invalidRows: 4
                errors:
                  - row: 1
                    field: name
                    message: El nombre es obligatorio
                  - row: 2
                    field: sku
                    message: El SKU es obligatorio
                  - row: 3
                    field: initialStock
                    message: El stock inicial no puede ser negativo
                  - row: 4
                    field: branchName
                    message: La sucursal no existe
                createdAt: '2026-06-02T20:10:00Z'
                completedAt: '2026-06-02T20:12:00Z'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to read this import batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Import batch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /import-batches/{importBatchId}/confirm:
    parameters:
      - in: path
        name: importBatchId
        required: true
        schema:
          type: string
        description: Identifier of the import batch to confirm.
    post:
      tags:
        - ImportBatches
      summary: Confirm a validated import batch
      description: |
        Commits the validated rows of an import batch. If the batch has
        invalid rows or is otherwise not in a confirmable state, the
        request is rejected with HTTP 422 and the standard `ErrorResponse`
        shape. If a confirmable batch contains rows with duplicate `sku`
        or `barcode` against the current catalog, the request fails with
        HTTP 409.

        On success, the backend creates the products and may create
        `incoming` inventory movements with reason `Initial import` to
        seed the initial stock balances.
      responses:
        '200':
          description: Import confirmed. Returns the updated batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
              example:
                id: import_001
                fileName: inventory_initial.csv
                importedBy: user_admin_001
                status: completed
                totalRows: 4
                validRows: 4
                invalidRows: 0
                createdAt: '2026-06-02T20:00:00Z'
                completedAt: '2026-06-02T20:05:00Z'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to confirm this import batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Import batch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate sku or barcode during confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            The batch cannot be confirmed because it contains invalid rows
            or is in a state that does not allow confirmation. Possible
            `error.code` values include `invalid_rows` and
            `batch_not_confirmable`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_rows
                  message: The batch contains invalid rows and cannot be confirmed.
                  details:
                    - field: row.1.name
                      message: El nombre es obligatorio
                    - field: row.3.initialStock
                      message: El stock inicial no puede ser negativo
                  requestId: req_import_confirm_01
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{productId}/image-upload-url:
    parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
        description: Identifier of the product whose image is being uploaded.
    post:
      tags:
        - Products
      summary: Request a signed URL to upload a product image
      description: |
        Returns short-lived instructions for the client to upload a
        product image directly to object storage. The backend never
        proxies the image bytes.

        Implementation notes:

        - Object-storage backends (S3, GCS, Azure Blob, Cloudflare R2)
          should return a presigned `PUT` or `POST` URL with the required
          headers.
        - Firebase Storage implementations can adapt this flow by mapping
          the response to a Firebase Storage upload task; the client uses
          the Firebase Storage SDK to perform the actual upload while the
          contract surface remains the same.

        After the storage upload succeeds, the client calls
        `POST /products/{productId}/image-upload-complete` so the backend
        can persist `publicUrl` on the product. `Product.imageUrl` remains
        the canonical persisted image reference.

        External-product lookup suggestions already carry a hosted
        `imageUrl`. Those values do not need to be re-uploaded unless the
        application explicitly chooses to host its own copy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductImageUploadRequest'
            example:
              contentType: image/jpeg
              fileSize: 184320
              originalFileName: arroz-1kg.jpg
      responses:
        '200':
          description: Upload instructions issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImageUploadInstructions'
              example:
                uploadId: upl_product_rice_001_01
                uploadUrl: https://storage.example.com/uploads/product_rice_001/1717358400-abc.jpg?signature=...
                method: PUT
                headers:
                  Content-Type: image/jpeg
                expiresAt: '2026-06-02T20:15:00Z'
                publicUrl: https://cdn.example.com/product-images/product_rice_001/1717358400-abc.jpg
        '400':
          description: Validation error on the upload request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to upload images for this product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Requested file size exceeds the backend upload policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Requested content type is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            The upload cannot proceed because the product is inactive or
            the upload policy rejects the request. Possible `error.code`
            values include `inactive_product` and `invalid_upload_policy`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{productId}/image-upload-complete:
    parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
        description: Identifier of the product whose image upload is being completed.
    post:
      tags:
        - Products
      summary: Confirm a product image upload and persist imageUrl
      description: |
        Confirms that the client finished uploading bytes through the
        signed URL issued by `POST /products/{productId}/image-upload-url`.
        On success, the backend persists the corresponding `publicUrl`
        into `Product.imageUrl` and returns the updated `Product`.

        If the upload session has expired before this call is made, the
        request is rejected with HTTP 410 and the client must request a
        new upload URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductImageUploadCompleteRequest'
            example:
              uploadId: upl_product_rice_001_01
      responses:
        '200':
          description: Upload confirmed. Returns the updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: product_rice_001
                name: Arroz 80% 1kg
                sku: ARR-001
                barcode: '7441000000012'
                category: Abarrotes
                description: Bolsa de arroz 80% de 1 kilogramo.
                imageUrl: https://cdn.example.com/product-images/product_rice_001/1717358400-abc.jpg
                minStock: 10
                isActive: true
                createdAt: '2026-06-02T20:00:00Z'
                updatedAt: '2026-06-02T20:15:00Z'
        '400':
          description: Validation error on the completion request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not allowed to confirm uploads for this product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product or upload session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Upload session has expired and can no longer be confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: upload_session_expired
                  message: The upload session has expired. Request a new upload URL and retry.
                  requestId: req_image_upload_complete_01
        '422':
          description: |
            The upload has not finished or is in an unconfirmable state.
            Possible `error.code` values include `upload_not_completed`
            and `invalid_upload_state`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:

    UserRole:
      type: string
      enum:
        - admin
        - collaborator
      description: Role of an authenticated user.

    MovementType:
      type: string
      enum:
        - incoming
        - outgoing
        - adjustment
      description: |
        Type of an inventory movement. Only `incoming` and `outgoing` are
        required for the MVP. `adjustment` is optional and may be supported
        in later iterations.

    ImportStatus:
      type: string
      enum:
        - pending
        - validated
        - completed
        - failed
      description: Lifecycle status of a product import batch.

    PlatformType:
      type: string
      enum:
        - android
        - ios
        - web
        - unknown
      description: Device platform reported for a push notification token.

    User:
      type: object
      required:
        - id
        - name
        - email
        - role
        - isActive
        - createdAt
      properties:
        id:
          type: string
          example: user_admin_001
        name:
          type: string
          example: María Rodríguez
        email:
          type: string
          format: email
          example: admin@inventario-demo.com
        role:
          $ref: '#/components/schemas/UserRole'
        branchIds:
          type: array
          items:
            type: string
          example:
            - branch_central
            - branch_north
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-06-02T20:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-02T20:00:00Z'

    Branch:
      type: object
      required:
        - id
        - name
        - isActive
        - createdAt
      properties:
        id:
          type: string
          example: branch_central
        name:
          type: string
          example: Sucursal Central
        address:
          type: string
          example: Centro de la ciudad
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-06-02T20:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-02T20:00:00Z'

    Product:
      type: object
      description: |
        Product in the catalog. Stock is not embedded in the product record.
        Available quantity is represented by the Stock schema, scoped by
        productId and branchId.
      required:
        - id
        - name
        - sku
        - category
        - minStock
        - isActive
        - createdAt
      properties:
        id:
          type: string
          example: product_rice_001
        name:
          type: string
          example: Arroz 80% 1kg
        sku:
          type: string
          example: ARR-001
        barcode:
          type: string
          nullable: true
          example: '7441000000012'
        category:
          type: string
          example: Abarrotes
        description:
          type: string
          example: Bolsa de arroz 80% de 1 kilogramo.
        imageUrl:
          type: string
          format: uri
          nullable: true
          example: https://example.com/images/arroz-1kg.jpg
        minStock:
          type: integer
          minimum: 0
          example: 10
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-06-02T20:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-02T20:00:00Z'

    Stock:
      type: object
      description: |
        Available quantity of a product in a specific branch. A single Stock
        record exists per `productId` and `branchId` combination.
      required:
        - id
        - productId
        - branchId
        - availableQuantity
        - updatedAt
      properties:
        id:
          type: string
          example: product_rice_001_branch_central
        productId:
          type: string
          example: product_rice_001
        branchId:
          type: string
          example: branch_central
        availableQuantity:
          type: integer
          minimum: 0
          example: 40
        lastMovementId:
          type: string
          nullable: true
          example: movement_001
        lastMovementAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-06-02T20:15:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-02T20:15:00Z'

    InventoryMovement:
      type: object
      description: |
        Inventory movement record. Stock balances change only through
        movements. `previousStock` and `resultingStock` capture the balance
        before and after the movement was applied.
      required:
        - id
        - productId
        - branchId
        - userId
        - type
        - quantity
        - previousStock
        - resultingStock
        - reason
        - createdAt
      properties:
        id:
          type: string
          example: movement_001
        productId:
          type: string
          example: product_rice_001
        branchId:
          type: string
          example: branch_central
        userId:
          type: string
          example: user_admin_001
        type:
          $ref: '#/components/schemas/MovementType'
        quantity:
          type: integer
          minimum: 1
          example: 40
        previousStock:
          type: integer
          minimum: 0
          example: 0
        resultingStock:
          type: integer
          minimum: 0
          example: 40
        reason:
          type: string
          example: Initial import
        notes:
          type: string
          example: Carga inicial de inventario.
        createdAt:
          type: string
          format: date-time
          example: '2026-06-02T20:15:00Z'

    NotificationToken:
      type: object
      required:
        - id
        - userId
        - token
        - platform
        - createdAt
      properties:
        id:
          type: string
          example: token_001
        userId:
          type: string
          example: user_admin_001
        token:
          type: string
          example: fcm_device_token_admin_demo
        platform:
          $ref: '#/components/schemas/PlatformType'
        createdAt:
          type: string
          format: date-time
          example: '2026-06-02T20:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-02T20:00:00Z'

    ImportBatchError:
      type: object
      required:
        - row
        - field
        - message
      properties:
        row:
          type: integer
          minimum: 1
          example: 8
        field:
          type: string
          example: initialStock
        message:
          type: string
          example: Stock inicial no puede ser negativo.

    ImportBatch:
      type: object
      description: |
        Optional record of a CSV product import. Persisted only when the
        product team decides to keep import history.
      required:
        - id
        - fileName
        - importedBy
        - status
        - totalRows
        - validRows
        - invalidRows
        - createdAt
      properties:
        id:
          type: string
          example: import_001
        fileName:
          type: string
          example: inventory_initial.csv
        importedBy:
          type: string
          example: user_admin_001
        status:
          $ref: '#/components/schemas/ImportStatus'
        totalRows:
          type: integer
          minimum: 0
          example: 4
        validRows:
          type: integer
          minimum: 0
          example: 4
        invalidRows:
          type: integer
          minimum: 0
          example: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportBatchError'
        createdAt:
          type: string
          format: date-time
          example: '2026-06-02T20:00:00Z'
        completedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-06-02T20:05:00Z'

    ExternalProductSuggestion:
      type: object
      description: |
        Suggested product data returned by the external lookup endpoint.
        The user must review and confirm these values before persisting them
        as a Product.
      required:
        - barcode
        - source
      properties:
        barcode:
          type: string
          example: '3017624010701'
        name:
          type: string
          nullable: true
          example: Nutella
        brand:
          type: string
          nullable: true
          example: Ferrero
        category:
          type: string
          nullable: true
          example: Spreads
        imageUrl:
          type: string
          format: uri
          nullable: true
          example: https://images.openfoodfacts.org/images/products/301/762/401/0701/front_en.400.jpg
        source:
          type: string
          example: open_food_facts

    AuthRegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Ana Gómez
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: a-strong-password
        role:
          $ref: '#/components/schemas/UserRole'
        branchIds:
          type: array
          items:
            type: string

    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          format: password
          example: a-strong-password

    AuthLoginResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.payload.signature
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    UserCreateRequest:
      type: object
      required:
        - name
        - email
        - role
      properties:
        name:
          type: string
          example: Carlos Pérez
        email:
          type: string
          format: email
          example: colaborador@inventario-demo.com
        role:
          $ref: '#/components/schemas/UserRole'
        branchIds:
          type: array
          items:
            type: string
        isActive:
          type: boolean
          default: true

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        branchIds:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    BranchCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Sucursal Norte
        address:
          type: string
          example: Zona norte
        isActive:
          type: boolean
          default: true

    BranchUpdateRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        isActive:
          type: boolean

    ProductCreateRequest:
      type: object
      required:
        - name
        - sku
        - category
        - minStock
      properties:
        name:
          type: string
          example: Frijoles negros 900g
        sku:
          type: string
          example: FRJ-001
        barcode:
          type: string
          nullable: true
          example: '7441000000029'
        category:
          type: string
          example: Abarrotes
        description:
          type: string
          example: Bolsa de frijoles negros de 900 gramos.
        imageUrl:
          type: string
          format: uri
          nullable: true
          example: https://example.com/images/frijoles-negros.jpg
        minStock:
          type: integer
          minimum: 0
          example: 8
        isActive:
          type: boolean
          default: true

    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        barcode:
          type: string
          nullable: true
        category:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          format: uri
          nullable: true
        minStock:
          type: integer
          minimum: 0
        isActive:
          type: boolean

    InventoryMovementCreateRequest:
      type: object
      description: |
        Request to register an inventory movement. The server validates the
        affected stock balance, rejects outgoing movements that exceed
        `availableQuantity`, and atomically updates both the Stock record
        and the InventoryMovement record.
      required:
        - productId
        - branchId
        - type
        - quantity
        - reason
      properties:
        productId:
          type: string
          example: product_rice_001
        branchId:
          type: string
          example: branch_central
        type:
          $ref: '#/components/schemas/MovementType'
        quantity:
          type: integer
          minimum: 1
          example: 40
        reason:
          type: string
          example: Initial import
        notes:
          type: string
          example: Carga inicial de inventario.

    NotificationTokenCreateRequest:
      type: object
      required:
        - token
        - platform
      properties:
        token:
          type: string
          example: fcm_device_token_admin_demo
        platform:
          $ref: '#/components/schemas/PlatformType'

    ImportBatchCreateRequest:
      type: object
      description: |
        Request to start a product import batch. The actual CSV content is
        expected to be uploaded through a separate multipart endpoint or a
        signed-URL flow; this payload carries the batch metadata.
      required:
        - fileName
      properties:
        fileName:
          type: string
          example: inventory_initial.csv

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: name
        message:
          type: string
          example: Name is required.

    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: validation_error
        message:
          type: string
          description: Human-readable error message.
          example: The request contains invalid fields.
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        requestId:
          type: string
          example: req_123

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      example:
        error:
          code: validation_error
          message: The request contains invalid fields.
          details:
            - field: name
              message: Name is required.
          requestId: req_123

    PaginatedResponse:
      type: object
      description: |
        Generic envelope for paginated list responses. Endpoints that return
        a paginated list extend this schema by overriding `items` with the
        concrete element type.
      required:
        - items
        - total
        - page
        - pageSize
        - hasNextPage
      properties:
        items:
          type: array
          items:
            type: object
        total:
          type: integer
          minimum: 0
          example: 25
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          example: 20
        hasNextPage:
          type: boolean
          example: true

    ProductImageUploadRequest:
      type: object
      description: |
        Request payload used to ask the backend for upload instructions
        for a product image. The backend mints a short-lived signed URL
        that the client uses to upload bytes directly to object storage.
      required:
        - contentType
      properties:
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
          example: image/jpeg
        fileSize:
          type: integer
          format: int64
          minimum: 1
          description: Optional client-reported size of the file in bytes.
          example: 184320
        originalFileName:
          type: string
          description: Optional original file name, useful for backend logging.
          example: arroz-1kg.jpg

    ProductImageUploadInstructions:
      type: object
      description: |
        Instructions returned by the backend so that the client can upload
        the image bytes directly to object storage. The `uploadUrl` is
        short-lived; the client must complete the upload and call
        `POST /products/{productId}/image-upload-complete` before
        `expiresAt`. `publicUrl` is the URL that will be persisted into
        `Product.imageUrl` once the upload is confirmed.
      required:
        - uploadId
        - uploadUrl
        - method
        - headers
        - expiresAt
        - publicUrl
      properties:
        uploadId:
          type: string
          example: upl_product_rice_001_01
        uploadUrl:
          type: string
          format: uri
          example: https://storage.example.com/uploads/product_rice_001/1717358400-abc.jpg?signature=...
        method:
          type: string
          enum:
            - PUT
            - POST
          example: PUT
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            Headers that the client must include in the upload request,
            typically at least `Content-Type` matching the requested type.
          example:
            Content-Type: image/jpeg
        expiresAt:
          type: string
          format: date-time
          example: '2026-06-02T20:15:00Z'
        publicUrl:
          type: string
          format: uri
          example: https://cdn.example.com/product-images/product_rice_001/1717358400-abc.jpg

    ProductImageUploadCompleteRequest:
      type: object
      description: |
        Request payload sent to confirm that an image upload finished and
        the backend should persist the corresponding `publicUrl` onto the
        product.
      required:
        - uploadId
      properties:
        uploadId:
          type: string
          example: upl_product_rice_001_01
