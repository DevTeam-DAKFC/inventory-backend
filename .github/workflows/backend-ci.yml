name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Restore, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./Inventory.Backend.sln

      - name: Build
        run: dotnet build ./Inventory.Backend.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./Inventory.Backend.sln --configuration Release --no-build --verbosity normal
